<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141422"/>
      <stop offset="50%" stop-color="#1c1d30"/>
      <stop offset="100%" stop-color="#261e40"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Dashed Border -->
  <rect x="20" y="20" width="760" height="560" rx="14" fill="none" stroke="rgba(99,102,241,0.3)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Warning Banner -->
  <g transform="translate(400, 70)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1.5"/>
    <text text-anchor="middle" y="5" fill="#fbbf24" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      ⚠️ GANTI DENGAN FOTO ASLI
    </text>
  </g>

  <!-- Camera / Album Icon -->
  <g transform="translate(400, 270)">
    <circle cx="0" cy="0" r="44" fill="rgba(99,102,241,0.18)" stroke="url(#accentGrad)" stroke-width="2.5"/>
    <path d="M-18 -10h6l4 -5h16l4 5h6a4 4 0 0 1 4 4v20a4 4 0 0 1 -4 4h-36a4 4 0 0 1 -4 -4v-20a4 4 0 0 1 4 -4z" fill="none" stroke="#e2e2f0" stroke-width="2.2"/>
    <circle cx="0" cy="3" r="8" fill="none" stroke="#c084fc" stroke-width="2.2"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="355" text-anchor="middle" fill="#ffffff" font-family="'Poppins', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700">
    Dokumentasi Kegiatan 1
  </text>
  <text x="400" y="390" text-anchor="middle" fill="#a5b4fc" font-family="'Inter', system-ui, sans-serif" font-size="13">
    Foto Dokumentasi 3 dari 3
  </text>
</svg>